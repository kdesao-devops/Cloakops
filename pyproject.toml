[project]
name = "cloakops"
version = "0.1.0"
description = "Local, reversible pseudonymization gateway for sending infrastructure data (Terraform, Kubernetes, logs, configs) to public LLMs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kevin De Sao", email = "kevin.desao@gmail.com" }
]
requires-python = ">=3.12.16,<3.13"
dependencies = []

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis==6.170.15",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pyyaml==6.0.3",
    "ruff==0.17.5",
    "types-pyyaml==6.0.12.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of tests
# Benchmark templates and fakes are data: long realistic lines are the point.
"src/cloakops/benchmark/templates.py" = ["E501"]
"src/cloakops/benchmark/fakes.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
